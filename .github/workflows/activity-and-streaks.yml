name: Generate Activity & Streaks

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Activity Graph
        run: curl -s "https://github-readme-activity-graph.vercel.app/graph?username=Infinite-L00pBaCk&bg_color=0D1117&color=00FFFF&line=00FFFF&point=FFFFFF&area=true&hide_border=true" -o github-activity-graph.svg

      - name: Download Streak Stats
        run: curl -s "https://streak-stats.demolab.com/?user=Infinite-L00pBaCk&theme=tokyonight&hide_border=true&background=0D1117" -o github-streak-stats.svg

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add github-activity-graph.svg github-streak-stats.svg
          git commit -m "chore: updated activity and streak graphs" || exit 0
          git push origin main
