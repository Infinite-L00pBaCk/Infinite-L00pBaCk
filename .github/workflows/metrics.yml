name: Metrics
on:
  # Schedule daily updates at midnight and noon
  schedule:
    - cron: "0 0,12 * * *"
  # Allow running manually from the Actions tab
  workflow_dispatch:
  # Run when changes are pushed to main
  push:
    branches:
      - main
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Overall Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          user: Infinite-L00pBaCk
          template: classic
          base: header
          config_timezone: Asia/Kolkata
          config_padding: 0, 0
          config_animations: yes
          extras_css: |
            svg { background: transparent !important; border: none !important; }
            
          # Achievements
          plugin_achievements: yes
          plugin_achievements_display: compact
          
          # Top Languages
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
